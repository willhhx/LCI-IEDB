   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="25.227692" y="38.571776" transform="rotate(-0 25.227692 38.571776)">1  IEDB T-cell assays</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 50.395514)">579,433 rows</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 59.031819)">human host, linear, MHC-I</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 67.668124)">unmodified, 8-11 aa canonical</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 76.304428)">HLA allele resolved</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 84.940733)">-&gt; 76,178 records</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="25.227692" y="181.385216" transform="rotate(-0 25.227692 181.385216)">1b  IEDB ligand + epitope</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 193.208954)">6,275,463 ligand rows</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 201.845259)">-&gt; 1,307,258 human HLA-I</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 210.481564)">records (binding evidence only)</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 219.117868)">epitope + antigen tables:</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(25.227692 227.754173)">parent protein, taxon</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="177.336346" y="38.571776" transform="rotate(-0 177.336346 38.571776)">2  Pair labels</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 50.395514)">peptide x HLA allele units</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 59.031819)">6,675 positive (functional)</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 67.668124)">5,705 negative (assay-verified)</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 76.304428)">1,103 cross-study conflicts</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 84.940733)">   -&gt; conflicts table</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 93.577038)">3,525 multimer-only (suppl.)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="177.336346" y="181.385216" transform="rotate(-0 177.336346 181.385216)">3  Decoy negatives</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 193.208954)">N1 same-protein decoys: 3,428</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 201.845259)">N3 length/binding/region-</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 210.481564)">  matched decoys: 4,675</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 219.117868)">(untested peptides; optional</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(177.336346 227.754173)"> alternative negative sets)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="329.445" y="38.571776" transform="rotate(-0 329.445 38.571776)">4  Dataset (v1.0)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 50.395514)">20,483 rows, 17,278 peptides</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 59.031819)">P 6,675   N2 5,705</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 67.668124)">N1 3,428   N3 4,675</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 76.304428)">evidence tier, PMID, assay,</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 84.940733)">confidence retained</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="329.445" y="181.385216" transform="rotate(-0 329.445 181.385216)">5  Leakage groups</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 193.208954)">connected components of</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 201.845259)">near-duplicate peptides</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 210.481564)">(similarity &gt;= 0.8), same parent</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 219.117868)">protein, same antigen family;</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(329.445 227.754173)">5,432 groups, largest 7.1 %</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="475.92" y="38.571776" transform="rotate(-0 475.92 38.571776)">6  Splits</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 50.395514)">S1 antigen-group (primary)</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 59.031819)">S2 held-out HLA</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 67.668124)">S3 held-out taxon</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 76.304428)">S4 random reference</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 84.940733)">70/10/20 + 5-fold CV</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #1d2433" x="475.92" y="181.385216" transform="rotate(-0 475.92 181.385216)">7  Evaluation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 193.208954)">9 baselines, 4 negative tiers</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 201.845259)">AUPRC, AUROC, MCC,</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 210.481564)">PPV@K, leakage gap, similarity bins,</text>
    <text style="font-size: 7px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5368" transform="translate(475.92 219.117868)">cluster-bootstrap CIs</text>
   </g>
